name: release
# Builds the one-file Windows installer. Push a tag such as v1.0.0, or run this by hand with a version
# number (for example 1.0.0), to publish it on the Releases page. Running it by hand with no version
# just builds the installer and attaches it to the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.1.0 (leave empty to only build)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/Aac.Core.Tests -c Release
      - name: Publish the app
        run: dotnet publish src/Aac.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\BetterTalk.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BetterTalk-Setup
          path: installer/Output/BetterTalk-Setup.exe
      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $env:INPUT_VERSION.TrimStart('v') }
          # The notes are this version's section of CHANGELOG.md (shown in the app's Settings → Updates), then how to install.
          $version = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::IndexOf($lines, "## $version")
          $section = @()
          if ($start -ge 0) { for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $section += $lines[$i] } }
          # The SHA-256 checksum goes below the --- line too, so people can check their download (README, "Is this safe?").
          $hash = (Get-FileHash installer/Output/BetterTalk-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path installer/Output/BetterTalk-Setup.exe.sha256 -Value "$hash  BetterTalk-Setup.exe" -Encoding ascii
          $notes = (($section -join "`n").Trim()) + "`n`n---`nTo install: download **BetterTalk-Setup.exe**, double-click it, and follow the prompts. Windows may say it protected your PC because the file is not signed: choose More info, then Run anyway.`n`nSHA-256 of BetterTalk-Setup.exe: ``$hash```nTo check it, run ``Get-FileHash .\BetterTalk-Setup.exe`` in PowerShell where you saved it. The installer was built from this release's code by the public release workflow on GitHub."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag installer/Output/BetterTalk-Setup.exe installer/Output/BetterTalk-Setup.exe.sha256 --target $env:GITHUB_SHA --title "BetterTalk $tag" --notes-file release-notes.md
